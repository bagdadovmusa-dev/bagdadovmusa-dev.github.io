<svg xmlns="http://www.w3.org/2000/svg" width="160" height="160" viewBox="0 0 160 160">
  <!-- Гирих: восьмиконечная звезда (рубʿ аль-хизб) в сетке.
       Рисуется линиями, повторяется плиткой — вес считанные байты. -->
  <g fill="none" stroke="#c9a84c" stroke-width="1.1" stroke-linejoin="round">
    <!-- центральная звезда: два квадрата, один повёрнут на 45° -->
    <rect x="45" y="45" width="70" height="70"/>
    <rect x="45" y="45" width="70" height="70" transform="rotate(45 80 80)"/>
    <!-- связки к соседним плиткам -->
    <path d="M80 0 L80 21 M80 139 L80 160 M0 80 L21 80 M139 80 L160 80"/>
    <!-- малые ромбы по углам — они замыкают узор на стыке плиток -->
    <path d="M0 0 L21 0 L0 21 Z M160 0 L139 0 L160 21 Z M0 160 L21 160 L0 139 Z M160 160 L139 160 L160 139 Z"/>
    <!-- тонкая внутренняя звезда -->
    <rect x="62" y="62" width="36" height="36" opacity="0.7"/>
    <rect x="62" y="62" width="36" height="36" transform="rotate(45 80 80)" opacity="0.7"/>
  </g>
</svg>
